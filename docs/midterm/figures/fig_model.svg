x="568" y="506" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Linear 768→512</text><text x="568" y="535" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">LayerNorm</text><text x="568" y="564" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Dropout 0.4</text></g><g><rect x="780" y="420" width="220" height="220" rx="12" fill="#FFFFFF" stroke="#9C3D7E" stroke-width="2"/><path d="M780 432 a12 12 0 0 1 12 -12 h196 a12 12 0 0 1 12 12 v40 h-220 z" fill="#9C3D7E"/><text x="890" y="452" font-family="Arial" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">Patch Transformer</text><text x="798" y="506" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">1 layer · 8 heads</text><text x="798" y="535" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">pre-LN, FFN 1024</text><text x="798" y="564" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">key-padding mask</text><text x="798" y="593" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">patch ↔ patch context</text></g><rect x="1040" y="230" width="210" height="300" rx="12" fill="#F3F6FA" stroke="#1B2A4A" stroke-width="2"/><text x="1145" y="266" font-family="Arial" font-size="20" fill="#1B2A4A" font-weight="700" text-anchor="middle">Token sequence</text><rect x="1090" y="282" width="110" height="26" rx="6" fill="#1B2A4A"/><text x="1145" y="301" font-family="Arial" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">CLS</text><rect x="1090" y="316" width="110" height="26" rx="6" fill="#56657F"/><text x="1145" y="335" font-family="Arial" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">US</text><rect x="1090" y="350" width="110" height="26" rx="6" fill="#9C3D7E"/><text x="1145" y="369" font-family="Arial" font-s