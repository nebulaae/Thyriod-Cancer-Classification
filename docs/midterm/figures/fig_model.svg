1660" y="262" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">MLP Head</text><text x="1568" y="316" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">LayerNorm</text><text x="1568" y="345" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Dropout 0.4</text><text x="1568" y="374" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Linear 512→128</text><text x="1568" y="403" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">GELU · Dropout 0.2</text><text x="1568" y="432" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Linear 128→1</text><text x="1568" y="461" font-family="Arial" font-size="17" fill="#E86B4C" font-weight="700" text-anchor="start">σ → P(PTC)</text></g><line x1="240" y1="205" x2="276" y2="205" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><line x1="510" y1="205" x2="546" y2="205" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><line x1="240" y1="530" x2="276" y2="530" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><line x1="510" y1="530" x2="546" y2="530" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><line x1="740" y1="530" x2="776" y2="530" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><polyline points="740,205 1010,205 1010,330 1036,330" fill="none" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><polyline points="1000,530 1015,530 1015,420 1036,420" fill="none" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><line x1="1250" y1="380" x2="1286" y2="380" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><line x1="1510" y1="380" x2="1546" y2="380" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><rect x="1040" y="110" width="210" height="64" rx="10" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2" stroke-dasharray="6 5"/><text x="1145" y="138" font-family="Arial" font-size="17" fill="#1B2A4A" font-weight="700" text-anchor="middle">Learnable [CLS]</text><text x="1145" y="162" font-family="Arial" font-size="15" fill="#5B6472" font-weight="400" text-anchor="middle">token (1 × 512)</text><line x1="1145" y1="174" x2="1145" y2="226" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><rect x="1290" y="580" width="480" height="104" rx="12" fill="#FFF4F1" stroke="#E86B4C" stroke-width="2"/><text x="1310" y="614" font-family="Arial" font-size="18" fill="#E86B4C" font-weight="700" text-anchor="start">Explainability tap (return_feats=True)</text><text x="1310" y="644" font-family="Consolas" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">relevance_j = cos( fused[CLS], fused[P_j] )</text><text x="1310" y="670" font-family="Arial" font-size="16" fill="#5B6472" font-weight="400" text-anchor="start">→ ranked patches, most relevant patch</text><line x1="1400" y1="530" x2="1400" y2="576" stroke="#5B6472" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ah)"/><text x="30" y="40" font-family="Arial" font-size="20" fill="#1B2A4A" font-weight="700" text-anchor="start">Dual-encoder multimodal transformer (≈ 2 × 28 M backbone parameters, last stages trainable)</text><text x="30" y="720" font-family="Arial" font-size="16" fill="#5B6472" font-weight="400" text-anchor="start" font-style="italic">Trainable: projections, transformers, [CLS], head, and the late ConvNeXt stages; early stages remain frozen ImageNet features.</text></svg>