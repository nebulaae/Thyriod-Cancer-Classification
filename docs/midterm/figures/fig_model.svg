<rect width="1800" height="760" fill="#FFFFFF"/><g><rect x="30" y="110" width="210" height="190" rx="12" fill="#FFFFFF" stroke="#56657F" stroke-width="2"/><path d="M30 122 a12 12 0 0 1 12 -12 h186 a12 12 0 0 1 12 12 v40 h-210 z" fill="#56657F"/><text x="135" y="142" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">Ultrasound</text><text x="48" y="196" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">1 image / patient</text><text x="48" y="225" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">3 × 224 × 224</text></g><g><rect x="30" y="420" width="210" height="220" rx="12" fill="#FFFFFF" stroke="#9C3D7E" stroke-width="2"/><path d="M30 432 a12 12 0 0 1 12 -12 h186 a12 12 0 0 1 12 12 v40 h-210 z" fill="#9C3D7E"/><text x="135" y="452" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">Cytology bag</text><text x="48" y="506" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">N patches (N = 2–7)</text><text x="48" y="535" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">N × 3 × 224 × 224</text><text x="48" y="564" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">+ mask [N]</text></g><g><rect x="280" y="110" width="230" height="190" rx="12" fill="#FFFFFF" stroke="#56657F" stroke-width="2"/><path d="M280 122 a12 12 0 0 1 12 -12 h206 a12 12 0 0 1 12 12 v62 h-230 z" fill="#56657F"/><text x="395" y="142" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">ConvNeXt-Tiny</text><text x="395" y="168" font-family="Consolas" font-size="15" fill="#E6EBF2" font-weight="400" text-anchor="middle">us_enc</text><text x="298" y="218" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">ImageNet-pretrained</text><text x="298" y="247" font-family="Arial" f