<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="860" viewBox="0 0 1800 860">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#5B6472"/></marker></defs>
<rect width="1800" height="860" fill="#FFFFFF"/><rect x="0" y="0" width="1800" height="80" fill="#1B2A4A"/><text x="900" y="52" font-family="Arial" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="middle">MVP CONCEPTUAL DIAGRAM — INTERPRETABLE MULTIMODAL THYROID LESION CLASSIFIER</text><g><rect x="30" y="120" width="316" height="520" rx="12" fill="#FFFFFF" stroke="#56657F" stroke-width="2"/><path d="M30 132 a12 12 0 0 1 12 -12 h292 a12 12 0 0 1 12 12 v40 h-316 z" fill="#56657F"/><text x="188" y="152" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">1 · Data Input</text><text x="48" y="206" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">Thyroid ultrasound</text><text x="48" y="244" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">(JPG / PNG)</text><text x="48" y="320" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">Cytology patches</text><text x="48" y="358" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">(2–7 TIF per patient)</text><text x="48" y="434" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">Patient ID or</text><text x="48" y="472" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">batch CSV</text></g><line x1="346" y1="380" x2="382" y2="380" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><g><rect x="386" y="120" width="316" height="520" rx="12" fill="#FFFFFF" stroke="#56657F" stroke-width="2"/><path d="M386 132 a12 12 0 0 1 12 -12 h292 a12 12 0 0 1 12 12 v40 h-316 z" fill="#56657F"/><text x="544" y="152" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">2 · Pre-processing</text><text x="404" y="206" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">Patient-level pairing</text><text x="404" y="244" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">and data audit</text><text x="404" y="320" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">Resize 224 × 224</text><text x="404" y="358" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">ImageNet normalisation</text><text x="404" y="434" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">Patch-bag padding</text><text x="404" y="472" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">+ attention mask</text></g><line x1="702" y1="380" x2="738" y2="380" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><g><rect x="742" y="120" width="316" height="520" rx="12" fill="#FFFFFF" stroke="#9C3D7E" stroke-width="2"/><path d="M742 132 a12 12 0 0 1 12 -12 h292 a12 12 0 0 1 12 12 v40 h-316 z" fill="#9C3D7E"/><text x="900" y="152" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">3 · Core AI Model</text><text x="760" y="206" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">Dual ConvNeXt-Tiny</text><text x="760" y="244" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">encoders (frozen early</text><text x="760" y="282" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">stages)</text><text x="760" y="358" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">Patch transformer</text><text x="760" y="396" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">Fusion transformer</text><text x="760" y="434" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">with [CLS] token</text><text x="760" y="510" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">5-fold patient-level CV</text></g><line x1="1058" y1="380" x2="1094" y2="380" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><g><rect x="1098" y="120" width="316" height="520" rx="12" fill="#FFFFFF" stroke="#E86B4C" stroke-width="2"/><path d="M1098 132 a12 12 0 0 1 12 -12 h292 a12 12 0 0 1 12 12 v40 h-316 z" fill="#E86B4C"/><text x="1256" y="152" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">4 · Risk Assessment</text><text x="1116" y="206" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">Malignancy probability</text><text x="1116" y="244" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">P(PTC) in [0, 1]</text><text x="1116" y="320" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">Benign / PTC decision</text><text x="1116" y="358" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">at Youden threshold</text><text x="1116" y="434" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">Confidence + calibration</text><text x="1116" y="472" font-family="Arial" font-size="21" fill="#1F2937" font-weight="400" text-anchor="start">Patch relevance ranking</text></g><line x1="1414" y1="380" x2="1450" y2="380" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><rect x="1454" y="120" width="316" height="520" rx="12" fill="#FFFFFF" stroke="#2E8B6E" stroke-width="2"/><path d="M1454 132 a12 12 0 0 1 12 -12 h292 a12 12 0 0 1 12 12 v40 h-316 z" fill="#2E8B6E"/><text x="1612" y="154" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">5 · MVP Web Interface</text><rect x="1470" y="190" width="284" height="80" rx="8" fill="#F3F6FA" stroke="#C9D1DD"/><text x="1484" y="220" font-family="Arial" font-size="16" fill="#1B2A4A" font-weight="700" text-anchor="start">Upload: US image + patches</text><rect x="1484" y="234" width="96" height="26" rx="5" fill="#1B2A4A"/><text x="1532" y="252" font-family="Arial" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">Analyse</text><rect x="1470" y="286" width="284" height="110" rx="8" fill="#FFF4F1" stroke="#E86B4C"/><text x="1484" y="316" font-family="Arial" font-size="16" fill="#E86B4C" font-weight="700" text-anchor="start">Result</text><text x="1484" y="352" font-family="Arial" font-size="26" fill="#1F2937" font-weight="700" text-anchor="start">P(PTC) = 0.91</text><text x="1484" y="380" font-family="Arial" font-size="16" fill="#5B6472" font-weight="400" text-anchor="start">→ PTC (τ* = 0.89)</text><rect x="1470" y="412" width="284" height="130" rx="8" fill="#F3F6FA" stroke="#C9D1DD"/><text x="1484" y="440" font-family="Arial" font-size="16" fill="#1B2A4A" font-weight="700" text-anchor="start">Patch relevance</text><rect x="1484" y="477" width="43.2" height="48.00000000000001" rx="3" fill="#9C3D7E" opacity="0.55"/><rect x="1535.2" y="489" width="43.2" height="36" rx="3" fill="#9C3D7E" opacity="0.55"/><rect x="1586.4" y="495" width="43.2" height="29.999999999999993" rx="3" fill="#9C3D7E" opacity="0.55"/><rect x="1637.6" y="465" width="43.2" height="60.00000000000002" rx="3" fill="#E86B4C" opacity="1"/><rect x="1688.8" y="489" width="43.2" height="36" rx="3" fill="#9C3D7E" opacity="0.55"/><rect x="1470" y="558" width="284" height="66" rx="8" fill="#FFFFFF" stroke="#C9D1DD"/><text x="1484" y="586" font-family="Arial" font-size="15" fill="#5B6472" font-weight="400" text-anchor="start">Export report (PNG/CSV)</text><text x="1484" y="610" font-family="Arial" font-size="15" fill="#E86B4C" font-weight="400" text-anchor="start" font-style="italic">Research use only</text><rect x="30" y="680" width="1740" height="76" rx="12" fill="#F3F6FA" stroke="#C9D1DD" stroke-width="2"/><text x="52" y="712" font-family="Arial" font-size="19" fill="#1B2A4A" font-weight="700" text-anchor="start">Research evaluation layer</text><text x="52" y="740" font-family="Arial" font-size="17" fill="#5B6472" font-weight="400" text-anchor="start">AUROC + bootstrap 95% CI · AUPRC · sensitivity / specificity · MCC · Brier score · ablation of overfitting controls · fixed seeds and configs</text><polyline points="900,676 900,646" fill="none" stroke="#5B6472" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ah)"/><text x="900" y="810" font-family="Arial" font-size="17" fill="#5B6472" font-weight="400" text-anchor="middle" font-style="italic">Labelled training data (384 paired patients) feed stage 3 offline; stages 1–5 run online for each new case.</text></svg>