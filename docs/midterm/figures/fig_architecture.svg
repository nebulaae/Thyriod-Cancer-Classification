<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#5B6472"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/><rect x="50" y="30" width="1502" height="64" rx="12" fill="#F3F6FA" stroke="#C9D1DD" stroke-width="2"/><text x="72" y="70" font-family="Arial" font-size="20" fill="#1B2A4A" font-weight="700" text-anchor="start">CFG — single source of truth</text><text x="400" y="70" font-family="Arial" font-size="18" fill="#5B6472" font-weight="400" text-anchor="start">seed 42 · 5 folds · 224 px · dim 512 · depth 1 · 8 heads · dropout 0.4 · lr 3e-5 · wd 1e-3 · LS 0.05</text><g><rect x="50" y="140" width="350" height="300" rx="12" fill="#FFFFFF" stroke="#56657F" stroke-width="2"/><path d="M50 152 a12 12 0 0 1 12 -12 h326 a12 12 0 0 1 12 12 v62 h-350 z" fill="#56657F"/><text x="225" y="172" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">Data Layer</text><text x="225" y="198" font-family="Consolas" font-size="15" fill="#E6EBF2" font-weight="400" text-anchor="middle">dataset1 … dataset4</text><text x="68" y="248" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">dataset1 · cytology, benign</text><text x="68" y="277" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">dataset2 · ultrasound, benign</text><text x="68" y="306" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">dataset3 · ultrasound, PTC</text><text x="68" y="335" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">dataset4 · cytology, PTC</text><text x="68" y="364" font-family="Arial" font-size="17" fill="#1F2937" font-weight="700" text-anchor="start">Paired by patient ID</text><text x="68" y="393" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">1 US image + 2–7 TIF patches</text></g><g><rect x="434" y="140" width="350" height="300" rx="12" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/><path d="M434 152 a12 12 0 0 1 12 -12 h326 a12 12 0 0 1 12 12 v62 h-350 z" fill="#1B2A4A"/><text x="609" y="172" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">Stage 1 · Data Audit</text><text x="609" y="198" font-family="Consolas" font-size="15" fill="#E6EBF2" font-weight="400" text-anchor="middle">build_metadata()</text><text x="452" y="248" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">US ∩ cytology ID pairing</text><text x="452" y="277" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Benign/PTC ID-overlap check</text><text x="452" y="306" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Patch-count outlier check</text><text x="452" y="335" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Patient-level stratified 5-fold</text><text x="452" y="364" font-family="Arial" font-size="17" fill="#2E8B6E" font-weight="700" text-anchor="start">→ metadata.csv (384 pts)</text><text x="452" y="393" font-family="Arial" font-size="17" fill="#2E8B6E" font-weight="400" text-anchor="start">→ data_audit.png</text></g><g><rect x="818" y="140" width="350" height="300" rx="12" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/><path d="M818 152 a12 12 0 0 1 12 -12 h326 a12 12 0 0 1 12 12 v62 h-350 z" fill="#1B2A4A"/><text x="993" y="172" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">Data Pipeline</text><text x="993" y="198" font-family="Consolas" font-size="15" fill="#E6EBF2" font-weight="400" text-anchor="middle">ThyroidDataset · collate_fn</text><text x="836" y="248" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Resize 224×224, ImageNet norm</text><text x="836" y="277" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Modality-specific augmentation</text><text x="836" y="306" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Variable-length patch bags</text><text x="836" y="335" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Zero-padding + boolean mask</text><text x="836" y="364" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Batch = {us, path, mask, y}</text></g><g><rect x="1202" y="140" width="350" height="300" rx="12" fill="#FFFFFF" stroke="#9C3D7E" stroke-width="2"/><path d="M1202 152 a12 12 0 0 1 12 -12 h326 a12 12 0 0 1 12 12 v62 h-350 z" fill="#9C3D7E"/><text x="1377" y="172" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">Model</text><text x="1377" y="198" font-family="Consolas" font-size="15" fill="#E6EBF2" font-weight="400" text-anchor="middle">MultimodalTransformer</text><text x="1220" y="248" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">2× ConvNeXt-Tiny encoders</text><text x="1220" y="277" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Partial backbone freezing</text><text x="1220" y="306" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Linear 768 → 512 projection</text><text x="1220" y="335" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Patch transformer (1 layer)</text><text x="1220" y="364" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Fusion transformer + [CLS]</text><text x="1220" y="393" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">MLP head → P(PTC)</text></g><g><rect x="1202" y="560" width="350" height="300" rx="12" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/><path d="M1202 572 a12 12 0 0 1 12 -12 h326 a12 12 0 0 1 12 12 v62 h-350 z" fill="#1B2A4A"/><text x="1377" y="592" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">Stage 2 · Training</text><text x="1377" y="618" font-family="Consolas" font-size="15" fill="#E6EBF2" font-weight="400" text-anchor="middle">train_fold()</text><text x="1220" y="668" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Label-smoothed BCE + pos_weight</text><text x="1220" y="697" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">AdamW · lr 3e-5 · wd 1e-3</text><text x="1220" y="726" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">5-epoch warmup + cosine</text><text x="1220" y="755" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Gradient clipping (norm 1.0)</text><text x="1220" y="784" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Early stopping on val AUROC</text><text x="1220" y="813" font-family="Arial" font-size="17" fill="#2E8B6E" font-weight="700" text-anchor="start">→ checkpoints/*.pth</text></g><g><rect x="818" y="560" width="350" height="300" rx="12" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/><path d="M818 572 a12 12 0 0 1 12 -12 h326 a12 12 0 0 1 12 12 v62 h-350 z" fill="#1B2A4A"/><text x="993" y="592" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">Stage 3 · Evaluation</text><text x="993" y="618" font-family="Consolas" font-size="15" fill="#E6EBF2" font-weight="400" text-anchor="middle">evaluate()</text><text x="836" y="668" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">AUROC + bootstrap 95% CI</text><text x="836" y="697" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">AUPRC · Acc · Balanced Acc · F1</text><text x="836" y="726" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">MCC · Cohen's κ · Brier</text><text x="836" y="755" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Sens · Spec · PPV · NPV</text><text x="836" y="784" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Youden-optimal threshold</text><text x="836" y="813" font-family="Arial" font-size="17" fill="#2E8B6E" font-weight="700" text-anchor="start">→ metrics CSV + figures</text></g><g><rect x="434" y="560" width="350" height="300" rx="12" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/><path d="M434 572 a12 12 0 0 1 12 -12 h326 a12 12 0 0 1 12 12 v62 h-350 z" fill="#1B2A4A"/><text x="609" y="592" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">Stage 4 · Explainability</text><text x="609" y="618" font-family="Consolas" font-size="15" fill="#E6EBF2" font-weight="400" text-anchor="middle">visualize_attention()</text><text x="452" y="668" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">TP / TN / FP / FN case picks</text><text x="452" y="697" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Cosine sim. [CLS] ↔ patch</text><text x="452" y="726" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Per-patch relevance scores</text><text x="452" y="755" font-family="Arial" font-size="17" fill="#2E8B6E" font-weight="700" text-anchor="start">→ attention_*.png</text></g><g><rect x="50" y="560" width="350" height="300" rx="12" fill="#FFFFFF" stroke="#E86B4C" stroke-width="2"/><path d="M50 572 a12 12 0 0 1 12 -12 h326 a12 12 0 0 1 12 12 v62 h-350 z" fill="#E86B4C"/><text x="225" y="592" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">Inference &amp; MVP</text><text x="225" y="618" font-family="Consolas" font-size="15" fill="#E6EBF2" font-weight="400" text-anchor="middle">model_inference.py</text><text x="68" y="668" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Single-patient CLI</text><text x="68" y="697" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Batch CSV scoring + metrics</text><text x="68" y="726" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Interactive demo mode</text><text x="68" y="755" font-family="Arial" font-size="17" fill="#E86B4C" font-weight="700" text-anchor="start">Planned: web dashboard</text><text x="68" y="784" font-family="Arial" font-size="17" fill="#E86B4C" font-weight="400" text-anchor="start">(upload → P(PTC) → patches)</text></g><line x1="400" y1="290" x2="430" y2="290" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><line x1="784" y1="290" x2="814" y2="290" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><line x1="1168" y1="290" x2="1198" y2="290" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><line x1="1377" y1="440" x2="1377" y2="556" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><line x1="1202" y1="710" x2="1172" y2="710" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><line x1="818" y1="710" x2="788" y2="710" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><line x1="434" y1="710" x2="404" y2="710" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><text x="800" y="520" font-family="Arial" font-size="18" fill="#5B6472" font-weight="400" text-anchor="middle" font-style="italic">main.py — run(): build_metadata → train_fold → evaluate → visualize_attention</text></svg>