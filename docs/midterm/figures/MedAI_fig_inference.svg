<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="400" viewBox="0 0 1800 400">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#5B6472"/></marker></defs>
<rect width="1800" height="400" fill="#FFFFFF"/><text x="20" y="40" font-family="Arial" font-size="20" fill="#1B2A4A" font-weight="700" text-anchor="start">Inference flow — model_inference.py (single, batch and demo modes)</text><g><rect x="20" y="70" width="262" height="262" rx="12" fill="#FFFFFF" stroke="#56657F" stroke-width="2"/><path d="M20 82 a12 12 0 0 1 12 -12 h238 a12 12 0 0 1 12 12 v40 h-262 z" fill="#56657F"/><text x="151" y="102" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">1 · Input</text><text x="38" y="156" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">US image path</text><text x="38" y="185" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Patch dir + patient ID</text><text x="38" y="214" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">or semicolon list</text><text x="38" y="243" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">or batch CSV</text></g><line x1="282" y1="201" x2="318" y2="201" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><g><rect x="322" y="70" width="262" height="262" rx="12" fill="#FFFFFF" stroke="#56657F" stroke-width="2"/><path d="M322 82 a12 12 0 0 1 12 -12 h238 a12 12 0 0 1 12 12 v40 h-262 z" fill="#56657F"/><text x="453" y="102" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">2 · Preprocess</text><text x="340" y="156" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">RGB convert</text><text x="340" y="185" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Resize 224 × 224</text><text x="340" y="214" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">ImageNet normalise</text><text x="340" y="243" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Stack patches</text><text x="340" y="272" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">All-true mask</text></g><line x1="584" y1="201" x2="620" y2="201" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><g><rect x="624" y="70" width="262" height="262" rx="12" fill="#FFFFFF" stroke="#9C3D7E" stroke-width="2"/><path d="M624 82 a12 12 0 0 1 12 -12 h238 a12 12 0 0 1 12 12 v40 h-262 z" fill="#9C3D7E"/><text x="755" y="102" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">3 · Load Model</text><text x="642" y="156" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">torch.load(.pth)</text><text x="642" y="185" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">cfg restored from</text><text x="642" y="214" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">checkpoint</text><text x="642" y="243" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">model.eval()</text><text x="642" y="272" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">no_grad()</text></g><line x1="886" y1="201" x2="922" y2="201" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><g><rect x="926" y="70" width="262" height="262" rx="12" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/><path d="M926 82 a12 12 0 0 1 12 -12 h238 a12 12 0 0 1 12 12 v40 h-262 z" fill="#1B2A4A"/><text x="1057" y="102" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">4 · Forward Pass</text><text x="944" y="156" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">logit, feats =</text><text x="944" y="185" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">model(us, path,</text><text x="944" y="214" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">  mask, feats=True)</text><text x="944" y="243" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">P(PTC) = σ(logit)</text></g><line x1="1188" y1="201" x2="1224" y2="201" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><g><rect x="1228" y="70" width="262" height="262" rx="12" fill="#FFFFFF" stroke="#E86B4C" stroke-width="2"/><path d="M1228 82 a12 12 0 0 1 12 -12 h238 a12 12 0 0 1 12 12 v40 h-262 z" fill="#E86B4C"/><text x="1359" y="102" font-family="Arial" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">5 · Decision</text><text x="1246" y="156" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">PTC if P &gt; τ</text><text x="1246" y="185" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">τ = 0.5 (default)</text><text x="1246" y="214" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">or Youden τ*</text><text x="1246" y="243" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">confidence =</text><text x="1246" y="272" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">max(P, 1 − P)</text></g><line x1="1490" y1="201" x2="1526" y2="201" stroke="#5B6472" stroke-width="3" marker-end="url(#ah)"/><g><rect x="1530" y="70" width="262" height="262" rx="12" fill="#FFFFFF" stroke="#2E8B6E" stroke-width="2"/><path d="M1530 82 a12 12 0 0 1 12 -12 h238 a12 12 0 0 1 12 12 v40 h-262 z" fill="#2E8B6E"/><text x="1661" y="102" font-family="Arial" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">6 · Explain &amp; Report</text><text x="1548" y="156" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Patch relevance</text><text x="1548" y="185" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">(cosine to [CLS])</text><text x="1548" y="214" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">Colour-coded figure</text><text x="1548" y="243" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">inference_*.png</text><text x="1548" y="272" font-family="Arial" font-size="17" fill="#1F2937" font-weight="400" text-anchor="start">results CSV + metrics</text></g><text x="20" y="380" font-family="Arial" font-size="16" fill="#5B6472" font-weight="400" text-anchor="start" font-style="italic">Batch mode additionally reports AUROC, accuracy and F1 when ground-truth labels are present in the CSV.</text></svg>